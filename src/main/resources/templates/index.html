<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ciudades - Panel de Gestión</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        @keyframes dropFromTop {
            0% {
                opacity: 0;
                transform: translateY(-40px) scale(0.96);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .animate-drop-down {
            animation: dropFromTop 0.32s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
        }
    </style>
</head>
<body class=" min-h-screen p-4 sm:p-8 flex flex-col justify-center items-center">

    <!-- Main White Card Container -->
    <div class="w-full max-w-5xl bg-white rounded-[28px] shadow-2xl p-6 sm:p-10 transition-all duration-300">
        
        <!-- Top Action Bar -->
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
            <div class="flex items-center gap-3 sm:gap-4 flex-wrap">
                <!-- Back to Home link -->
                <a href="/home" title="Volver al Inicio" 
                   class="w-10 h-10 rounded-full bg-slate-50 hover:bg-slate-100 text-slate-600 flex items-center justify-center border border-slate-200/70 transition-all shadow-sm">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
                    </svg>
                </a>

                <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-800 tracking-tight">Ciudades</h1>
                
                <!-- Primary Purple Pill Button (CREAR NUEVO) -->
                <button type="button" onclick="openCreateModal()" 
                        class="inline-flex items-center gap-2 px-6 py-2.5 bg-[#5b36f5] hover:bg-[#4b26e0] active:scale-95 text-white text-xs font-bold uppercase tracking-wider rounded-full shadow-md hover:shadow-lg transition-all duration-200">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/>
                    </svg>
                    Crear Nuevo
                </button>
            </div>

            <!-- Search / Filter Input -->
            <div class="relative flex items-center">
                <input type="text" id="tableSearch" onkeyup="filterTable()" placeholder="Buscar..." 
                       class="w-full sm:w-60 pl-4 pr-10 py-2 text-xs bg-slate-50 hover:bg-slate-100/80 focus:bg-white border border-slate-200 rounded-full focus:outline-none focus:ring-2 focus:ring-[#5b36f5]/20 focus:border-[#5b36f5] transition-all text-slate-700 placeholder:text-slate-400">
                <div class="absolute right-3 text-slate-400 pointer-events-none">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                    </svg>
                </div>
            </div>
        </div>

        <!-- Table Container -->
        <div class="overflow-x-auto">
            <table class="w-full text-left text-sm border-collapse" id="citiesTable">
                <thead>
                    <!-- Warm/Beige Header Row matching screenshot -->
                    <tr class="bg-[#fcf8f2] text-[#827565] text-xs font-semibold select-none border-b border-orange-100/50">
                        <th class="py-3.5 px-5 rounded-l-xl">
                            <div class="flex items-center gap-1.5">
                                <span>ID</span>
                            </div>
                        </th>
                        <th class="py-3.5 px-5">
                            <div class="flex items-center gap-1.5 cursor-pointer hover:text-slate-800">
                                <span>Nombre</span>
                                <svg class="w-3 h-3 opacity-60" fill="currentColor" viewBox="0 0 24 24">
                                    <path d="M12 4l-5 6h10l-5-6zm0 16l5-6H7l5 6z"/>
                                </svg>
                            </div>
                        </th>
                        <th class="py-3.5 px-5">
                            <div class="flex items-center gap-1.5 cursor-pointer hover:text-slate-800">
                                <span>País</span>
                                <svg class="w-3 h-3 opacity-60" fill="currentColor" viewBox="0 0 24 24">
                                    <path d="M12 4l-5 6h10l-5-6zm0 16l5-6H7l5 6z"/>
                                </svg>
                            </div>
                        </th>
                        <th class="py-3.5 px-5">
                            <div class="flex items-center gap-1.5 cursor-pointer hover:text-slate-800">
                                <span>Distrito</span>
                                <svg class="w-3 h-3 opacity-60" fill="currentColor" viewBox="0 0 24 24">
                                    <path d="M12 4l-5 6h10l-5-6zm0 16l5-6H7l5 6z"/>
                                </svg>
                            </div>
                        </th>
                        <th class="py-3.5 px-5">
                            <div class="flex items-center gap-1.5 cursor-pointer hover:text-slate-800">
                                <span>Población</span>
                                <svg class="w-3 h-3 opacity-60" fill="currentColor" viewBox="0 0 24 24">
                                    <path d="M12 4l-5 6h10l-5-6zm0 16l5-6H7l5 6z"/>
                                </svg>
                            </div>
                        </th>
                        <th class="py-3.5 px-5 text-center rounded-r-xl">
                            <span>Acción</span>
                        </th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-100 text-slate-600">
                    <tr th:each="c : ${cities}" class="hover:bg-slate-50/60 transition-colors duration-150">
                        <td class="py-4 px-5 font-semibold text-slate-800" th:text="${c.id}"></td>
                        <td class="py-4 px-5 font-medium text-slate-800" th:text="${c.name}"></td>
                        <td class="py-4 px-5">
                            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-amber-50 text-amber-800 border border-amber-200/60" th:text="${c.countryCode}"></span>
                        </td>
                        <td class="py-4 px-5 text-slate-600" th:text="${c.district}"></td>
                        <td class="py-4 px-5 font-mono text-xs text-slate-700" th:text="${#numbers.formatInteger(c.population, 3, 'POINT')}"></td>
                        <td class="py-4 px-5 text-center">
                            <div class="inline-flex items-center justify-center gap-2">
                                <!-- Edit Icon Button (Purple circle as in screenshot) -->
                                <button type="button"
                                        title="Editar"
                                        th:data-id="${c.id}"
                                        th:data-name="${c.name}"
                                        th:data-country="${c.countryCode}"
                                        th:data-district="${c.district}"
                                        th:data-population="${c.population}"
                                        onclick="openEditModal(this)"
                                        class="w-8 h-8 rounded-full bg-[#ede9fe] text-[#5b36f5] hover:bg-[#5b36f5] hover:text-white flex items-center justify-center transition-all duration-150 shadow-sm">
                                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/>
                                    </svg>
                                </button>
                                
                                <!-- Delete Icon Button (Coral/Red circle as in screenshot) -->
                                <a th:href="@{/eliminar/{id}(id=${c.id})}"
                                   title="Eliminar"
                                   onclick="return confirm('¿Seguro que deseas eliminar esta ciudad?');"
                                   class="w-8 h-8 rounded-full bg-[#fee2e2] text-[#ef4444] hover:bg-[#ef4444] hover:text-white flex items-center justify-center transition-all duration-150 shadow-sm">
                                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                                    </svg>
                                </a>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(cities)}">
                        <td colspan="6" class="py-12 text-center text-slate-400">
                            No hay ciudades registradas. Haz clic en <strong>"Crear Nuevo"</strong> para comenzar.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Footer / Pagination bar matching screenshot -->
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mt-8 pt-6 border-t border-slate-100 text-xs text-slate-500">
            <div class="flex items-center gap-2">
                <span>Mostrando</span>
                <span class="font-semibold text-slate-800" th:text="${#lists.size(cities)}">0</span>
                <span>ciudades registradas</span>
            </div>
            
            <div class="flex items-center gap-2">
                <button type="button" class="w-8 h-8 rounded-full border border-slate-200 text-slate-400 flex items-center justify-center hover:bg-slate-50 transition-colors">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/>
                    </svg>
                </button>
                <button type="button" class="w-8 h-8 rounded-full bg-[#f0a824] hover:bg-[#e09b1f] text-white flex items-center justify-center font-bold shadow-sm transition-colors">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/>
                    </svg>
                </button>
            </div>
        </div>

    </div>

    <!-- Modal Form (Slide Down Smooth Animation from Above) -->
    <div id="cityModal" class="fixed inset-0 z-50 hidden overflow-y-auto bg-slate-950/40 backdrop-blur-sm transition-opacity" onclick="onBackdropClick(event)">
        <div class="min-h-full flex items-start justify-center p-4 pt-12 sm:pt-20">
            
            <div id="modalCard" class="relative w-full max-w-lg bg-white rounded-[24px] shadow-2xl border border-slate-100 p-6 sm:p-8 animate-drop-down" onclick="event.stopPropagation()">
                
                <!-- Modal Header -->
                <div class="flex items-center justify-between pb-4 mb-6 border-b border-slate-100">
                    <div class="flex items-center gap-3">
                        <div class="w-9 h-9 rounded-full bg-[#ede9fe] text-[#5b36f5] flex items-center justify-center font-bold">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
                            </svg>
                        </div>
                        <div>
                            <h3 id="modalTitle" class="text-xl font-extrabold text-slate-800">Nueva Ciudad</h3>
                            <p class="text-xs text-slate-400">Ingresa los detalles del registro</p>
                        </div>
                    </div>
                    <button type="button" onclick="closeModal()" class="w-8 h-8 flex items-center justify-center text-slate-400 hover:text-slate-700 hover:bg-slate-100 rounded-full transition-colors">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"/>
                        </svg>
                    </button>
                </div>

                <!-- Modal Form -->
                <form th:action="@{/guardar}" method="post" class="space-y-4">
                    <input type="hidden" id="cityId" name="id" />

                    <div>
                        <label for="cityName" class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">Nombre de Ciudad</label>
                        <input type="text" id="cityName" name="name" required placeholder="Ej. Barcelona"
                               class="w-full px-4 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#5b36f5]/20 focus:border-[#5b36f5] transition-all placeholder:text-slate-400 text-slate-800 font-medium" />
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label for="cityCountryCode" class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">País (Código)</label>
                            <input type="text" id="cityCountryCode" name="countryCode" required placeholder="Ej. ESP" maxlength="3"
                                   class="w-full px-4 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#5b36f5]/20 focus:border-[#5b36f5] transition-all placeholder:text-slate-400 text-slate-800 font-medium uppercase" />
                        </div>

                        <div>
                            <label for="cityDistrict" class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">Distrito</label>
                            <input type="text" id="cityDistrict" name="district" required placeholder="Ej. Cataluña"
                                   class="w-full px-4 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#5b36f5]/20 focus:border-[#5b36f5] transition-all placeholder:text-slate-400 text-slate-800 font-medium" />
                        </div>
                    </div>

                    <div>
                        <label for="cityPopulation" class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">Población</label>
                        <input type="number" id="cityPopulation" name="population" required placeholder="Ej. 1620000"
                               class="w-full px-4 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#5b36f5]/20 focus:border-[#5b36f5] transition-all placeholder:text-slate-400 text-slate-800 font-medium" />
                    </div>

                    <!-- Modal Actions -->
                    <div class="flex items-center justify-end gap-3 pt-6 mt-6 border-t border-slate-100">
                        <button type="button" onclick="closeModal()" 
                                class="px-5 py-2.5 text-xs font-bold uppercase tracking-wider text-slate-500 hover:text-slate-800 hover:bg-slate-100 rounded-full transition-all">
                            Cancelar
                        </button>
                        <button type="submit" 
                                class="px-7 py-2.5 bg-[#5b36f5] hover:bg-[#4b26e0] active:scale-95 text-white text-xs font-bold uppercase tracking-wider rounded-full shadow-md hover:shadow-lg transition-all duration-200">
                            Guardar
                        </button>
                    </div>
                </form>

            </div>
        </div>
    </div>

    <!-- Script for Modal and Live Table Search -->
    <script>
        const modal = document.getElementById('cityModal');
        const modalTitle = document.getElementById('modalTitle');
        const cityId = document.getElementById('cityId');
        const cityName = document.getElementById('cityName');
        const cityCountryCode = document.getElementById('cityCountryCode');
        const cityDistrict = document.getElementById('cityDistrict');
        const cityPopulation = document.getElementById('cityPopulation');

        function openCreateModal() {
            modalTitle.innerText = 'Nueva Ciudad';
            cityId.value = '';
            cityName.value = '';
            cityCountryCode.value = '';
            cityDistrict.value = '';
            cityPopulation.value = '';
            showModal();
        }

        function openEditModal(button) {
            modalTitle.innerText = 'Editar Ciudad';
            cityId.value = button.getAttribute('data-id') || '';
            cityName.value = button.getAttribute('data-name') || '';
            cityCountryCode.value = button.getAttribute('data-country') || '';
            cityDistrict.value = button.getAttribute('data-district') || '';
            cityPopulation.value = button.getAttribute('data-population') || '';
            showModal();
        }

        function showModal() {
            modal.classList.remove('hidden');
            document.body.classList.add('overflow-hidden');
            setTimeout(() => cityName.focus(), 120);
        }

        function closeModal() {
            modal.classList.add('hidden');
            document.body.classList.remove('overflow-hidden');
        }

        function onBackdropClick(event) {
            if (event.target === modal || event.target.id === 'cityModal') {
                closeModal();
            }
        }

        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape' && !modal.classList.contains('hidden')) {
                closeModal();
            }
        });

        // Live table search
        function filterTable() {
            const input = document.getElementById('tableSearch');
            const filter = input.value.toLowerCase();
            const table = document.getElementById('citiesTable');
            const tr = table.getElementsByTagName('tbody')[0].getElementsByTagName('tr');

            for (let i = 0; i < tr.length; i++) {
                const text = tr[i].textContent || tr[i].innerText;
                if (text.toLowerCase().indexOf(filter) > -1) {
                    tr[i].style.display = '';
                } else {
                    tr[i].style.display = 'none';
                }
            }
        }
    </script>
</body>
</html>
