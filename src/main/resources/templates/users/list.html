<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="min-h-screen bg-slate-50 p-4 sm:p-8">
    <main class="mx-auto w-full max-w-6xl rounded-[28px] bg-white p-6 shadow-xl shadow-slate-200/70 sm:p-10">
        <div class="mb-7 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
            <div class="flex items-center gap-3 sm:gap-4 flex-wrap">
                <a th:href="@{/home}" title="Volver al inicio" class="flex h-9 w-9 items-center justify-center rounded-full border border-slate-200 text-xl text-slate-500 transition hover:bg-slate-100">&#8592;</a>
                <div>
                    <h1 class="text-2xl font-extrabold tracking-tight text-slate-800 sm:text-3xl">Usuarios</h1>
                    <p class="mt-1 text-xs text-slate-400">Administración de cuentas del sistema</p>
                </div>
                <!-- Botón Crear Usuario -->
                <a th:href="@{/usuarios/nuevo}" 
                   class="inline-flex items-center gap-2 px-5 py-2.5 bg-[#5b36f5] hover:bg-[#4b26e0] active:scale-95 text-white text-xs font-bold uppercase tracking-wider rounded-full shadow-md hover:shadow-lg transition-all duration-200">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/>
                    </svg>
                    <span>Crear Usuario</span>
                </a>
            </div>
            <div class="relative w-full sm:w-60">
                <input id="tableSearch" type="search" onkeyup="filterTable()" placeholder="Buscar..." class="w-full rounded-full border border-slate-200 bg-slate-50 py-2 pl-4 pr-10 text-xs text-slate-700 outline-none transition focus:border-violet-500 focus:bg-white focus:ring-2 focus:ring-violet-100">
                <span class="pointer-events-none absolute right-4 top-2 text-slate-400">⌕</span>
            </div>
        </div>

        <div class="overflow-x-auto">
            <table id="usersTable" class="w-full border-collapse text-left text-sm">
                <thead>
                    <tr class="border-b border-orange-100 bg-[#fcf8f2] text-xs font-semibold text-[#827565]">
                        <th class="rounded-l-xl px-5 py-3.5">ID</th>
                        <th class="px-5 py-3.5">Usuario</th>
                        <th class="px-5 py-3.5">Roles</th>
                        <th class="px-5 py-3.5">Estado</th>
                        <th class="rounded-r-xl px-5 py-3.5 text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-100 text-slate-600">
                    <tr th:each="u : ${usuarios}" class="transition-colors hover:bg-slate-50">
                        <td class="px-5 py-4 font-semibold text-slate-800" th:text="${u.id}"></td>
                        <td class="px-5 py-4 font-medium text-slate-800" th:text="${u.username}"></td>
                        <td class="px-5 py-4">
                            <div class="flex flex-wrap gap-1.5">
                                <span th:each="rol : ${u.roles}" 
                                      th:text="${rol.nombre}" 
                                      class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-[#ede9fe] text-[#5b36f5] border border-violet-200/60">
                                </span>
                                <span th:if="${#lists.isEmpty(u.roles)}" class="text-xs text-slate-400 italic">Sin roles</span>
                            </div>
                        </td>
                        <td class="px-5 py-4">
                            <span th:text="${u.enabled ? 'Activo' : 'Inactivo'}" 
                                  th:classappend="${u.enabled ? ' bg-emerald-50 text-emerald-700 border-emerald-200' : ' bg-red-50 text-red-700 border-red-200'}" 
                                  class="inline-flex rounded-full border px-2.5 py-1 text-xs font-semibold"></span>
                        </td>
                        <td class="px-5 py-4 text-center">
                            <div class="inline-flex items-center justify-center gap-2">
                                <a th:href="@{/usuarios/editar/{id}(id=${u.id})}" 
                                   title="Editar" 
                                   class="w-8 h-8 rounded-full bg-[#ede9fe] text-[#5b36f5] hover:bg-[#5b36f5] hover:text-white flex items-center justify-center transition-all duration-150 shadow-sm">
                                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/>
                                    </svg>
                                </a>
                                <a th:href="@{/usuarios/eliminar/{id}(id=${u.id})}" 
                                   title="Eliminar" 
                                   onclick="return confirm('¿Seguro que deseas eliminar este usuario?');" 
                                   class="w-8 h-8 rounded-full bg-[#fee2e2] text-[#ef4444] hover:bg-[#ef4444] hover:text-white flex items-center justify-center transition-all duration-150 shadow-sm">
                                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                                    </svg>
                                </a>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(usuarios)}">
                        <td colspan="5" class="px-5 py-12 text-center text-sm text-slate-400">No hay usuarios registrados.</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <footer class="mt-8 border-t border-slate-100 pt-6 text-xs text-slate-500">
            Mostrando <span class="font-semibold text-slate-800" th:text="${#lists.size(usuarios)}">0</span> usuarios registrados
        </footer>
    </main>

    <script>
        function filterTable() {
            const filter = document.getElementById('tableSearch').value.toLowerCase();
            document.querySelectorAll('#usersTable tbody tr').forEach(row => {
                row.style.display = row.textContent.toLowerCase().includes(filter) ? '' : 'none';
            });
        }
    </script>
</body>
</html>
