<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Mi Sistema</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        @keyframes dropFromTop {
            0% {
                opacity: 0;
                transform: translateY(-40px) scale(0.96);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .animate-drop-down {
            animation: dropFromTop 0.32s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
        }
    </style>
</head>

<body class=" min-h-screen p-4 sm:p-8 flex items-center justify-center">

    <div class="w-full max-w-md bg-white rounded-[28px] shadow-2xl border border-slate-100 p-8 sm:p-10 animate-drop-down transition-all duration-300">
        
        <!-- Header / Logo Icon -->
        <div class="text-center mb-8">
            <div class="w-14 h-14 rounded-full bg-[#ede9fe] text-[#5b36f5] flex items-center justify-center mx-auto mb-4 shadow-sm">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                </svg>
            </div>
            <h1 class="text-2xl font-extrabold text-slate-800 tracking-tight">Iniciar Sesión</h1>
            <p class="text-xs text-slate-400 mt-1">Ingresa tus credenciales para acceder al sistema</p>
        </div>

        <!-- Formulario -->
        <form th:action="@{/login}" method="post" class="space-y-4">
            <div>
                <label for="username" class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">Usuario</label>
                <div class="relative">
                    <input type="text" id="username" name="username" required placeholder="Tu nombre de usuario"
                           class="w-full pl-10 pr-4 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#5b36f5]/20 focus:border-[#5b36f5] transition-all placeholder:text-slate-400 text-slate-800 font-medium" />
                    <div class="absolute left-3.5 top-3 text-slate-400 pointer-events-none">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                        </svg>
                    </div>
                </div>
            </div>

            <div>
                <label for="password" class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">Contraseña</label>
                <div class="relative">
                    <input type="password" id="password" name="password" required placeholder="••••••••"
                           class="w-full pl-10 pr-4 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#5b36f5]/20 focus:border-[#5b36f5] transition-all placeholder:text-slate-400 text-slate-800 font-medium" />
                    <div class="absolute left-3.5 top-3 text-slate-400 pointer-events-none">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                        </svg>
                    </div>
                </div>
            </div>

            <div class="pt-2">
                <button type="submit" 
                        class="w-full py-3 bg-[#5b36f5] hover:bg-[#4b26e0] active:scale-95 text-white text-xs font-bold uppercase tracking-wider rounded-full shadow-md hover:shadow-lg transition-all duration-200 flex items-center justify-center gap-2">
                    <span>Entrar</span>
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
                    </svg>
                </button>
            </div>
        </form>

        <!-- Mensajes de estado -->
        <div th:if="${param.error}" class="mt-4 p-3 bg-red-50 border border-red-200/60 rounded-xl text-xs font-medium text-red-600 flex items-center gap-2.5">
            <svg class="w-4 h-4 text-red-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            <span>Credenciales inválidas. Por favor intenta de nuevo.</span>
        </div>

        <div th:if="${param.logout}" class="mt-4 p-3 bg-emerald-50 border border-emerald-200/60 rounded-xl text-xs font-medium text-emerald-700 flex items-center gap-2.5">
            <svg class="w-4 h-4 text-emerald-600 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            <span>Sesión cerrada correctamente.</span>
        </div>

    </div>

</body>
</html>
